services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan solo al crear el volumen por primera vez, en orden alfabético.
      - ./.challenge/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cocos -d cocos']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
